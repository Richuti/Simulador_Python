<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador de Estructuras Python</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Arma programas con bloques, mira cómo funcionan pilas, colas, listas, diccionarios, tuplas y conjuntos, y exporta el código en Python.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header class="barra">
  <div class="marca">
    <span class="logo" aria-hidden="true">[ ]</span>
    <div>
      <h1>Simulador de Estructuras</h1>
      <p>Bloques que se convierten en Python</p>
    </div>
  </div>

  <div class="controles" role="toolbar" aria-label="Ejecución">
    <button id="btn-ejecutar" class="primario" title="Ejecutar (Ctrl+Enter)">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg><span>Ejecutar</span>
    </button>
    <button id="btn-paso" title="Ejecutar una instrucción a la vez (F8)">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5v11l7-5.5z"/><rect x="11" y="2.5" width="2.2" height="11" rx=".6"/></svg><span>Paso a paso</span>
    </button>
    <button id="btn-detener" title="Detener" disabled>
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/></svg><span>Detener</span>
    </button>
    <label class="velocidad" for="velocidad">
      <span>Velocidad <b id="velocidad-texto">Normal</b></span>
      <input type="range" id="velocidad" min="1" max="5" step="1" value="3">
    </label>
  </div>

  <div class="proyecto">
    <label class="sr" for="ejemplos">Cargar un ejemplo</label>
    <select id="ejemplos">
      <option value="">Ejemplos…</option>
    </select>
    <button id="btn-nuevo" class="discreto">Nuevo</button>
    <button id="btn-abrir" class="discreto">Abrir</button>
    <button id="btn-guardar" class="discreto">Guardar</button>
    <input type="file" id="archivo" accept=".json,application/json" hidden>
  </div>
</header>

<main class="area">
  <section class="editor" aria-label="Área de bloques">
    <div id="blockly"></div>
    <div class="editor-herramientas">
      <button id="btn-zoom-mas" class="icono" title="Acercar" aria-label="Acercar">+</button>
      <button id="btn-zoom-menos" class="icono" title="Alejar" aria-label="Alejar">−</button>
      <button id="btn-centrar" class="icono texto" title="Acomodar los bloques en columna">Acomodar</button>
    </div>
  </section>

  <div id="divisor" class="divisor" role="separator" aria-orientation="vertical" aria-label="Cambiar el ancho del panel" tabindex="0"></div>

  <section class="panel">
    <div class="panel-cab">
      <h2>Escenario</h2>
      <p id="estado" class="estado" aria-live="polite"></p>
      <button id="btn-ordenar" class="discreto chico" title="Volver a acomodar las tarjetas">Ordenar tarjetas</button>
    </div>
    <div id="escenario" class="escenario sin-tarjetas">
      <div id="lienzo" class="lienzo"></div>
      <p class="escenario-vacio">Aquí aparecerán tus variables, pilas, colas, listas y diccionarios cuando ejecutes el programa. Puedes arrastrar cada tarjeta.</p>
    </div>

    <div class="inferior">
      <section class="caja-codigo" aria-label="Código Python generado">
        <div class="caja-cab">
          <h2>Código Python</h2>
          <button id="btn-copiar" class="discreto chico">Copiar</button>
          <button id="btn-descargar" class="discreto chico">Descargar .py</button>
        </div>
        <div id="codigo" class="codigo" tabindex="0"></div>
        <textarea id="copia-manual" class="copia-manual" hidden aria-label="Código para copiar" readonly></textarea>
      </section>
      <section class="caja-consola" aria-label="Consola">
        <div class="caja-cab"><h2>Consola</h2></div>
        <div id="salida" class="salida" aria-live="polite"></div>
      </section>
    </div>
  </section>
</main>

<div id="dialogo" class="dialogo" hidden>
  <form id="dialogo-form" class="dialogo-caja" role="dialog" aria-modal="true" aria-labelledby="dialogo-mensaje">
    <p id="dialogo-mensaje"></p>
    <input type="text" id="dialogo-campo" autocomplete="off" aria-label="Valor">
    <div class="dialogo-botones">
      <button type="button" id="dialogo-cancelar" class="discreto">Cancelar</button>
      <button type="submit" id="dialogo-aceptar" class="primario">Aceptar</button>
    </div>
  </form>
</div>
<div id="aviso" class="aviso" role="status" hidden></div>

<script src="https://unpkg.com/blockly@11.1.1/blockly_compressed.js"></script>
<script src="https://unpkg.com/blockly@11.1.1/blocks_compressed.js"></script>
<script src="https://unpkg.com/blockly@11.1.1/msg/es.js"></script>
<script>
  // Si no hay internet, usa la copia local de Blockly incluida en el repositorio.
  if (!window.Blockly || !Blockly.libraryBlocks) {
    document.write('<script src="vendor/blockly/blockly_compressed.js"><\/script>' +
      '<script src="vendor/blockly/blocks_compressed.js"><\/script>' +
      '<script src="vendor/blockly/msg/es.js"><\/script>');
  }
</script>
<script src="js/valores.js"></script>
<script src="js/bloques.js"></script>
<script src="js/interprete.js"></script>
<script src="js/python.js"></script>
<script src="js/escenario.js"></script>
<script src="js/ejemplos.js"></script>
<script src="js/app.js"></script>
</body>
</html>
